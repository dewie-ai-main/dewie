# docker-compose.e2e-pgvector.yml — containerized e2e stack, Postgres + pgvector
# (the production-like backend; same image family as the quick-start compose)
#
# Usage:
#   docker compose -f docker-compose.e2e-pgvector.yml up -d --build --wait
#   scripts/smoke_compose.sh 8767
#   docker compose -f docker-compose.e2e-pgvector.yml down -v

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: dewie-e2e-pgvector
    environment:
      POSTGRES_DB: dewie
      POSTGRES_USER: dewie
      POSTGRES_PASSWORD: dewie-pass
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dewie"]
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  dewie-pgvector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dewie-e2e-pgvector-api
    command: ["python", "-m", "dewie.cli", "serve"]
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql+asyncpg://dewie:dewie-pass@postgres-pgvector:5432/dewie
      AUTH_ENABLED: "false"
      ENABLE_ENRICHMENT: "true"
      ENRICHMENT_DEFAULT_BACKEND: passthrough
      ENRICHMENT_SLEEP_SECS: "1"
      ENABLE_INGESTION: "false"
      ENABLE_POLLER: "false"
      DEWIE_DATA_DIR: /app/data
      LOG_LEVEL: info
    ports:
      - "${E2E_PORT:-8767}:10946"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10946/health"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  pgvector-data:
