<!DOCTYPE html>
<html lang="en">
<head>
  <script>window._pfx=(function(){var m=location.pathname.match(/^(\/t\/[^/]+)/);return m?m[1]:'';})();</script>
  <script>(function(){var t=localStorage.getItem('dewie-theme')||'signal';document.documentElement.setAttribute('data-theme',t);})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dewie — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070f; --bg2: #0d0d1a; --bg3: #12121f;
      --border: var(--border); --purple: var(--purple);
      --purple-lo: var(--purple-lo); --green: #22c55e;
      --red: #ef4444; --text: #e2e8f0; --dim: #64748b; --xdim: #334155;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
    }

    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 20px;
    }

    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px;
    }

    .logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; margin-bottom: 28px;
      justify-content: center;
    }

    .logo-mark {
      width: 28px; height: 28px; background: var(--purple);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }

    .logo-mark svg { width: 15px; height: 15px; fill: #fff; }

    .logo-text {
      font-family: var(--mono); font-size: 0.9rem; font-weight: 500; color: var(--text);
    }
    .logo-text span { color: var(--purple); }

    .title {
      font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem; color: var(--dim); margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .label {
      display: block; font-size: 0.8rem; color: var(--dim);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 8px; font-weight: 500;
    }

    .input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px; color: var(--text);
      font-size: 0.9rem; font-family: var(--sans); outline: none;
      transition: border-color 0.2s;
    }

    .input:focus { border-color: var(--purple); }
    .input::placeholder { color: var(--xdim); }

    .btn-primary {
      width: 100%; background: var(--purple); color: #fff; border: none;
      padding: 11px 16px; border-radius: 8px; font-size: 0.875rem;
      font-weight: 500; font-family: var(--sans); cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover:not(:disabled) { background: var(--purple-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .error {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px; padding: 12px; font-size: 0.8rem; color: #f87171;
      margin-bottom: 16px; display: none;
    }

    .error.show { display: block; }

    .success {
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px; padding: 12px; font-size: 0.8rem; color: #86efac;
      margin-bottom: 16px; display: none;
    }

    .success.show { display: block; }

    .hint {
      font-size: 0.75rem; color: var(--dim); margin-top: 6px;
    }

    .help-text {
      font-size: 0.75rem; color: var(--dim); text-align: center; margin-top: 16px;
    }

    .help-text a {
      color: var(--accent-light); text-decoration: none;
    }

    .help-text a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block; animation: spin 1s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href=window._pfx+"/ui/theme.css";document.head.appendChild(l);})()</script>
</head>
<body>

<div class="container">
  <div class="card">
    <!-- LOGO -->
    <a href="/ui/app.html" class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 3a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 10c-2.67 0-5-1.34-6.4-3.37.03-2.12 4.27-3.3 6.4-3.3s6.37 1.18 6.4 3.3C15 13.66 12.67 15 10 15z"/></svg>
      </div>
      <span class="logo-text">dewie</span>
    </a>

    <!-- RESET PASSWORD FORM -->
    <div class="title">Reset password</div>
    <div class="subtitle">Please enter your new password below</div>

    <div class="error" id="reset-error"></div>
    <div class="success" id="reset-success"></div>

    <form id="reset-form" onsubmit="handleReset(event)">
      <div class="form-group">
        <label class="label" for="new-password">New password</label>
        <input class="input" id="new-password" type="password" placeholder="••••••••" required />
        <div class="hint">At least 8 characters recommended</div>
      </div>

      <div class="form-group">
        <label class="label" for="confirm-password">Confirm new password</label>
        <input class="input" id="confirm-password" type="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary" id="reset-btn">
        <span id="reset-btn-text">Update password</span>
      </button>
    </form>

    <div class="help-text">
      <a href="#" onclick="window.location.href='/ui/login.html'; return false;">Back to login</a>
    </div>
  </div>
</div>

<script>
// ── API base path ─────────────────────────────────────────────────────────

const API = window._pfx + '/api';

// ── Error/Success handling ────────────────────────────────────────────────

function clearErrors() {
  document.querySelectorAll('.error').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.success').forEach(el => {
    el.classList.remove('show');
    el.style.display = '';
  });
}

function showError(message) {
  clearErrors();
  const el = document.getElementById('reset-error');
  el.textContent = message || 'Something went wrong. Try again.';
  el.classList.add('show');
}

function showSuccess(message) {
  clearErrors();
  const el = document.getElementById('reset-success');
  el.textContent = message || 'Success!';
  el.style.display = 'block';
  el.classList.add('show');
}

// ── Reset handler ──────────────────────────────────────────────────────────

async function handleReset(e) {
  e.preventDefault();
  clearErrors();

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    showError('Missing reset token in URL.');
    return;
  }

  const password = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (password !== confirmPassword) {
    showError('Passwords do not match.');
    return;
  }

  if (password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner">⟳</span> <span id="reset-btn-text">Updating...</span>';

  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ reset_token: token, password })
    });

    if (res.ok) {
      showSuccess('✓ Password updated successfully! Redirecting...');
      setTimeout(() => {
        window.location.href = window._pfx + '/ui/login.html';
      }, 1500);
    } else {
      const data = await res.json().catch(() => ({}));
      const detail = data.detail;
      const msg = Array.isArray(detail)
        ? detail.map(e => e.msg || JSON.stringify(e)).join('; ')
        : (typeof detail === 'string' ? detail : 'Invalid or expired token. Try again.');
      showError(msg);
      btn.disabled = false;
      btn.innerHTML = '<span id="reset-btn-text">Update password</span>';
    }
  } catch (err) {
    showError('Network error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<span id="reset-btn-text">Update password</span>';
  }
}
</script>
<script>(function(){var s=document.createElement("script");s.src=window._pfx+"/ui/theme-picker.js";s.defer=true;document.head.appendChild(s);})()</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!window._pfx)return;
  document.querySelectorAll('a[href^="/ui/"]').forEach(function(a){
    a.href=window._pfx+a.getAttribute('href');
  });
});
</script>
</body>
</html>
