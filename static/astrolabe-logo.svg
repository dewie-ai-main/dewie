<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#3b0764"/>
    </linearGradient>
  </defs>

  <!-- Background disc -->
  <circle cx="50" cy="54" r="44" fill="url(#bg)"/>

  <!-- Outer limb ring -->
  <circle cx="50" cy="54" r="41" fill="none" stroke="#c9922a" stroke-width="2.5"/>

  <!-- Degree tick marks on limb -->
  <g stroke="#c9922a" stroke-width="1.2">
    <!-- 12 major ticks at 30° intervals -->
    <line x1="50" y1="13" x2="50" y2="18"/>
    <line x1="70.5" y1="18.5" x2="67.9" y2="23"/>
    <line x1="84.5" y1="33.5" x2="80.5" y2="36"/>
    <line x1="91" y1="54" x2="86" y2="54"/>
    <line x1="84.5" y1="74.5" x2="80.5" y2="72"/>
    <line x1="70.5" y1="89.5" x2="67.9" y2="85"/>
    <line x1="50" y1="95" x2="50" y2="90"/>
    <line x1="29.5" y1="89.5" x2="32.1" y2="85"/>
    <line x1="15.5" y1="74.5" x2="19.5" y2="72"/>
    <line x1="9" y1="54" x2="14" y2="54"/>
    <line x1="15.5" y1="33.5" x2="19.5" y2="36"/>
    <line x1="29.5" y1="18.5" x2="32.1" y2="23"/>
    <!-- Minor ticks -->
    <line x1="60.5" y1="14" x2="59.2" y2="18.5" stroke-width="0.7"/>
    <line x1="39.5" y1="14" x2="40.8" y2="18.5" stroke-width="0.7"/>
    <line x1="78" y1="25" x2="75.5" y2="29" stroke-width="0.7"/>
    <line x1="88" y1="43" x2="83.5" y2="44.5" stroke-width="0.7"/>
    <line x1="88" y1="65" x2="83.5" y2="63.5" stroke-width="0.7"/>
    <line x1="78" y1="83" x2="75.5" y2="79" stroke-width="0.7"/>
    <line x1="60.5" y1="94" x2="59.2" y2="89.5" stroke-width="0.7"/>
    <line x1="39.5" y1="94" x2="40.8" y2="89.5" stroke-width="0.7"/>
    <line x1="22" y1="83" x2="24.5" y2="79" stroke-width="0.7"/>
    <line x1="12" y1="65" x2="16.5" y2="63.5" stroke-width="0.7"/>
    <line x1="12" y1="43" x2="16.5" y2="44.5" stroke-width="0.7"/>
    <line x1="22" y1="25" x2="24.5" y2="29" stroke-width="0.7"/>
  </g>

  <!-- Tropic of Cancer -->
  <circle cx="50" cy="54" r="30" fill="none" stroke="#c9922a" stroke-width="1" opacity="0.6"/>
  <!-- Equator -->
  <circle cx="50" cy="54" r="20" fill="none" stroke="#c9922a" stroke-width="1" opacity="0.5"/>
  <!-- Tropic of Capricorn -->
  <circle cx="50" cy="54" r="11" fill="none" stroke="#c9922a" stroke-width="0.8" opacity="0.4"/>

  <!-- Meridian / altitude lines -->
  <line x1="50" y1="13" x2="50" y2="95" stroke="#c9922a" stroke-width="0.8" opacity="0.35"/>
  <line x1="9" y1="54" x2="91" y2="54" stroke="#c9922a" stroke-width="0.8" opacity="0.35"/>

  <!-- Rete — star pointer arms (the spidery overlay) -->
  <!-- Main rule arm (alidade) — gold, bold -->
  <line x1="50" y1="54" x2="71" y2="26" stroke="#f0c040" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Star pointer 1 -->
  <line x1="50" y1="54" x2="27" y2="35" stroke="#c9922a" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- Star pointer 2 -->
  <line x1="50" y1="54" x2="68" y2="76" stroke="#c9922a" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <!-- Star pointer 3 (shorter) -->
  <line x1="50" y1="54" x2="32" y2="70" stroke="#c9922a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Star dots at pointer tips -->
  <circle cx="71" cy="26" r="2.2" fill="#f0c040"/>
  <circle cx="27" cy="35" r="1.8" fill="#c9922a"/>
  <circle cx="68" cy="76" r="1.8" fill="#c9922a"/>
  <circle cx="32" cy="70" r="1.4" fill="#c9922a" opacity="0.7"/>

  <!-- Center pivot -->
  <circle cx="50" cy="54" r="3.5" fill="#c9922a"/>
  <circle cx="50" cy="54" r="1.5" fill="#3b0764"/>

  <!-- Suspension shackle at top -->
  <rect x="44" y="2" width="12" height="8" rx="2" fill="#4c1d95" stroke="#c9922a" stroke-width="1.8"/>
  <path d="M47 6 Q50 2 53 6" fill="none" stroke="#c9922a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
