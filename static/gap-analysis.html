<!DOCTYPE html>
<html lang="en">
<head>
  <script>window._pfx=(function(){var m=location.pathname.match(/^(\/t\/[^/]+)/);return m?m[1]:'';})();</script>
<script>(function(){var t=localStorage.getItem('dewie-theme')||'signal';document.documentElement.setAttribute('data-theme',t);})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='10' fill='%236366f1'/><path d='M10 2a8 8 0 100 16A8 8 0 0010 2zm0 3a2 2 0 110 4 2 2 0 010-4zm0 9.5c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z' fill='white'/></svg>" type="image/svg+xml" /><title>Dewie — Gap Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07070f;--bg2:#0d0d1a;--bg3:#12121f;--border:var(--border);--purple:var(--purple);--purple-lo:var(--purple-lo);--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--text:#e2e8f0;--dim:#64748b;--xdim:#334155;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);background-size:48px 48px;}
nav{position:sticky;top:0;z-index:100;background:rgba(7,7,15,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.nav-logo-mark{width:28px;height:28px;background:var(--purple);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.nav-logo-mark svg{width:15px;height:15px;fill:#fff;}
.nav-logo-text{font-family:var(--mono);font-size:0.9rem;font-weight:500;color:var(--text);}
.nav-logo-text span{color:var(--purple);}
.nav-badge{font-size:0.68rem;font-family:var(--mono);color:var(--accent-light);background:var(--purple-lo);border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin-left:8px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-link{font-size:0.82rem;color:var(--dim);text-decoration:none;padding:5px 12px;border-radius:6px;transition:all 0.15s;}
.nav-link:hover{color:var(--text);background:var(--purple-lo);}
.nav-link.active{color:var(--text);background:var(--purple-lo);}
.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:32px 24px;}
.search-row{display:flex;gap:10px;margin-bottom:28px;}
.input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-size:0.95rem;font-family:var(--sans);outline:none;transition:border-color 0.15s;}
.input:focus{border-color:var(--purple);}
.input::placeholder{color:var(--xdim);}
.btn{padding:12px 22px;border-radius:8px;border:none;cursor:pointer;font-size:0.84rem;font-weight:500;font-family:var(--sans);transition:all 0.15s;}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--purple-dark);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.signal-banner{border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:flex-start;gap:16px;}
.signal-banner.covered{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);}
.signal-banner.partial{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);}
.signal-banner.gap{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);}
.signal-icon{font-size:2rem;line-height:1;flex-shrink:0;}
.signal-text{flex:1;}
.signal-title{font-size:0.95rem;font-weight:600;margin-bottom:4px;}
.signal-banner.covered .signal-title{color:#4ade80;}
.signal-banner.partial .signal-title{color:#fbbf24;}
.signal-banner.gap .signal-title{color:#f87171;}
.signal-desc{font-size:0.82rem;color:var(--dim);line-height:1.55;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px 22px;}
.panel-title{font-size:0.72rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;color:var(--dim);margin-bottom:14px;}
.doc-card{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
.doc-card:last-child{border-bottom:none;}
.doc-score{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--green);min-width:40px;text-align:right;flex-shrink:0;}
.doc-body{flex:1;min-width:0;}
.doc-title{font-size:0.82rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;}
.doc-source{font-size:0.68rem;color:var(--dim);font-family:var(--mono);margin-bottom:4px;}
.doc-summary{font-size:0.75rem;color:var(--dim);line-height:1.45;}
.doc-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:0.62rem;font-family:var(--mono);padding:2px 6px;border-radius:100px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);}
.tag.aq{background:var(--purple-lo);border-color:var(--border-hi);color:var(--accent-light);}
.btn-sm{font-size:0.68rem;padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--dim);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all 0.15s;}
.btn-sm:hover{border-color:var(--border-hi);color:var(--text);}
.empty{text-align:center;padding:32px;color:var(--dim);font-size:0.82rem;}
.loading{color:var(--dim);font-size:0.82rem;padding:16px 0;display:flex;align-items:center;gap:8px;}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href=window._pfx+"/ui/theme.css";document.head.appendChild(l);})()</script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/ui/app.html" class="nav-logo">
      <div class="nav-logo-mark"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 3a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 10c-2.67 0-5-1.34-6.4-3.37.03-2.12 4.27-3.3 6.4-3.3s6.37 1.18 6.4 3.3C15 13.66 12.67 15 10 15z"/></svg></div>
      <span class="nav-logo-text">dewie</span>
    </a>
    <div class="nav-links">
      <a href="/ui/app.html" class="nav-link">Query</a>
      <a href="/ui/corpus.html" class="nav-link">Corpus</a>
      <a href="/ui/documents.html" class="nav-link">Catalog</a>
      <a href="/ui/my-uploads.html" class="nav-link">Uploads</a>
    </div>
    <div class="nav-right">
      <span id="nav-user" style="font-size:0.78rem;color:var(--dim)"></span>
      <a href="/ui/admin.html" class="nav-link">← Admin</a>
    </div>
  </div>
</nav>
<div class="page">
  <div class="search-row">
    <input class="input" id="q" placeholder="Enter a topic or question — what should the corpus be able to answer?" onkeydown="if(event.key==='Enter')analyze()"/>
    <select id="corpus-scope" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:0.84rem;outline:none;min-width:160px;" title="Corpus filter">
      <option value="all" selected>Public + Private</option>
      <option value="public">Public only</option>
      <option value="personal">My uploads only</option>
    </select>
    <button class="btn btn-primary" id="btn" onclick="analyze()">Analyze</button>
  </div>
  <div id="signal-section"></div>
  <div id="results-section"></div>
</div>
<script>
const API='/api';

async function init(){
  const me=await fetch(`${API}/auth/me`,{credentials:'include'}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(me && !me.detail){
    document.getElementById('nav-user').textContent=me.email||'';
    if(me.user_id) window._userId=me.user_id;
  } else {
    document.getElementById('nav-user').textContent='local mode';
  }
  const q=new URLSearchParams(location.search).get('q');
  if(q){document.getElementById('q').value=q;analyze();}
}

async function analyze(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  const corpusScope=document.getElementById('corpus-scope')?.value||'all';
  const corpusPayload=_corpusPayload(corpusScope);
  const btn=document.getElementById('btn');
  btn.disabled=true;
  document.getElementById('signal-section').innerHTML='<div class="loading"><div class="spin"></div>Running gap analysis…</div>';
  document.getElementById('results-section').innerHTML='';
  history.replaceState(null,'',`?q=${encodeURIComponent(q)}`);

  // Run both in parallel
  const [probeData,queryData]=await Promise.all([
    fetch(`${API}/capabilities/probe`,{
      method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({context:q,limit:8})
    }).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${API}/query`,{
      method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q,limit:8,ranker:'rrf_chunks',...corpusPayload})
    }).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  btn.disabled=false;

  // Determine signal from probe data
  const gap=probeData?.gap_signal;
  const conf=probeData?.confidence;
  let signalClass='partial',signalIcon='🟡',signalTitle='Partial Coverage',signalDesc='The corpus has some relevant information but may not fully answer this question.';
  if(gap==='gap'||conf==='low'){signalClass='gap';signalIcon='🔴';signalTitle='Gap Detected';signalDesc='The corpus does not appear to have strong coverage of this topic. Consider ingesting relevant documents.';}
  else if(!gap&&conf&&conf!=='low'){signalClass='covered';signalIcon='🟢';signalTitle='Corpus Has This Covered';signalDesc='Strong coverage detected. The retrieval system should be able to answer questions on this topic.';}

  document.getElementById('signal-section').innerHTML=`
    <div class="signal-banner ${signalClass}">
      <div class="signal-icon">${signalIcon}</div>
      <div class="signal-text">
        <div class="signal-title">${signalTitle}</div>
        <div class="signal-desc">${signalDesc}${gap?` Gap signal: "${esc(gap)}"`:''}</div>
      </div>
    </div>`;

  // Render two columns
  const probeResults=probeData?.results||[];
  const queryResults=queryData?.results||[];

  document.getElementById('results-section').innerHTML=`<div class="two-col">
    <div class="panel">
      <div class="panel-title">Probe Results — Capability Match (${probeResults.length})</div>
      ${probeResults.length?probeResults.map(r=>docCard(r)).join(''):
        '<div class="empty">No probe results.</div>'}
    </div>
    <div class="panel">
      <div class="panel-title">Retrieval Results — rrf_chunks (${queryResults.length})</div>
      ${queryResults.length?queryResults.map(r=>docCard(r)).join(''):
        '<div class="empty">No retrieval results.</div>'}
    </div>
  </div>`;
}

function docCard(r){
  const scoreVal=(r.score||r.relevance_score||0);
  const scoreDisplay=(scoreVal*100).toFixed(1);
  const aqCount=Array.isArray(r.answers_questions)?r.answers_questions.length:0;
  return `<div class="doc-card">
    <div class="doc-score">${scoreDisplay}</div>
    <div class="doc-body">
      <div class="doc-title">${esc(r.title||'Untitled')}</div>
      <div class="doc-source">${esc(r.source||'')}</div>
      ${r.summary?`<div class="doc-summary">${esc(r.summary.slice(0,120))}…</div>`:''}
      <div class="doc-meta">
        ${aqCount?`<span class="tag aq">${aqCount} AQs</span>`:''}
        ${(r.keywords||[]).slice(0,3).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}
        <a class="btn-sm" href="/ui/inspect.html?id=${r.id}">🔍 Inspect</a>
      </div>
    </div>
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _corpusPayload(scope){
  if(!scope||scope==='all')return{};
  if(scope==='public')return{corpus_scope:'public'};
  if(scope==='personal'){
    const uid=window._userId||null;
    const ids=uid?[`user:${uid}`]:null;
    return ids?{corpus_scope:'personal',corpus_ids:ids}:{corpus_scope:'personal'};
  }
  return{};
}
init();
</script>
<script>(function(){var s=document.createElement("script");s.src=window._pfx+"/ui/theme-picker.js";s.defer=true;document.head.appendChild(s);})()</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!window._pfx)return;
  document.querySelectorAll('a[href^="/ui/"]').forEach(function(a){
    a.href=window._pfx+a.getAttribute('href');
  });
});
</script>
</body>
</html>
