<!DOCTYPE html>
<html lang="en">
<head>
  <script>window._pfx=(function(){var m=location.pathname.match(/^(\/t\/[^/]+)/);return m?m[1]:'';})();</script>
  <script>(function(){var t=localStorage.getItem('dewie-theme')||'signal';document.documentElement.setAttribute('data-theme',t);})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='10' fill='%236366f1'/><path d='M6 4h5l4 4v8H6V4z' fill='white'/><path d='M11 4v4h4' fill='none' stroke='%236366f1' stroke-width='1.5'/></svg>" type="image/svg+xml" />
  <title>Dewie — My Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070f; --bg2: #0d0d1a; --bg3: #12121f;
      --border: var(--border); --purple: var(--purple);
      --purple-lo: var(--purple-lo); --green: #22c55e;
      --red: #ef4444; --yellow: #fbbf24; --text: #e2e8f0;
      --dim: #64748b; --xdim: #334155;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 100; background: rgba(7,7,15,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .nav-logo-mark { width: 28px; height: 28px; background: var(--purple); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .nav-logo-mark svg { width: 15px; height: 15px; fill: #fff; }
    .nav-logo-text { font-family: var(--mono); font-size: 0.9rem; font-weight: 500; color: var(--text); }
    .nav-logo-text span { color: var(--purple); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-user { font-size: 0.8rem; color: var(--dim); }
    .nav-admin { font-size: 0.78rem; color: var(--accent-light); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; display: none; }
    .nav-admin:hover { background: var(--purple-lo); }
    .btn-signout { font-size: 0.78rem; color: var(--dim); background: none; border: none; cursor: pointer; padding: 4px 8px; font-family: var(--sans); }
    .btn-signout:hover { color: var(--text); }

    /* LAYOUT */
    .page { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; display: flex; gap: 24px; }

    /* SIDEBAR FILTERS */
    .filters { width: 240px; flex-shrink: 0; }
    .filters-sticky { position: sticky; top: 72px; }
    .filter-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .filter-title { font-size: 0.68rem; font-family: var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
    .filter-label { font-size: 0.78rem; color: var(--dim); margin-bottom: 6px; display: block; }
    .filter-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--text); font-family: var(--sans); font-size: 0.82rem; outline: none; margin-bottom: 10px; }
    .filter-input:focus { border-color: var(--purple); }
    .filter-input::placeholder { color: var(--xdim); }
    .filter-select { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--text); font-family: var(--sans); font-size: 0.82rem; outline: none; margin-bottom: 10px; cursor: pointer; }
    .filter-select:focus { border-color: var(--purple); }
    .btn-apply { width: 100%; padding: 9px; background: var(--purple); color: #fff; border: none; border-radius: 8px; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; cursor: pointer; }
    .btn-apply:hover { background: var(--purple-dark); }
    .btn-clear { width: 100%; margin-top: 8px; padding: 9px; background: transparent; color: var(--dim); border: 1px solid var(--border); border-radius: 8px; font-family: var(--sans); font-size: 0.82rem; cursor: pointer; }
    .btn-clear:hover { color: var(--text); border-color: var(--border-hi); }

    /* TAG FILTER BUILDER */
    .tag-filter-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .tag-filter-row { display: flex; gap: 6px; align-items: center; }
    .tag-filter-row input { flex: 1; min-width: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--text); font-family: var(--mono); font-size: 0.75rem; outline: none; }
    .tag-filter-row input:focus { border-color: var(--purple); }
    .tag-filter-row input::placeholder { color: var(--xdim); }
    .btn-rm-tag { background: none; border: none; color: var(--xdim); cursor: pointer; font-size: 1rem; padding: 0 2px; line-height: 1; }
    .btn-rm-tag:hover { color: var(--red); }
    .btn-add-tag { background: none; border: 1px dashed var(--xdim); border-radius: 6px; color: var(--dim); font-size: 0.75rem; padding: 5px 10px; cursor: pointer; font-family: var(--sans); width: 100%; text-align: center; }
    .btn-add-tag:hover { border-color: var(--purple); color: var(--purple); }

    /* MAIN CONTENT */
    .main { flex: 1; min-width: 0; }
    .page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .page-title { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
    .page-count { font-size: 0.78rem; color: var(--dim); font-family: var(--mono); }

    /* SEARCH BAR */
    .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-input { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 16px; color: var(--text); font-family: var(--sans); font-size: 0.9rem; outline: none; }
    .search-input:focus { border-color: var(--purple); }
    .search-input::placeholder { color: var(--xdim); }

    /* ACTIVE FILTERS STRIP */
    .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; min-height: 0; }
    .active-filter-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--purple-lo); border: 1px solid var(--border-hi);
      border-radius: 20px; padding: 4px 12px; font-size: 0.76rem;
      color: var(--accent-light); font-family: var(--mono);
    }
    .active-filter-chip button { background: none; border: none; color: var(--accent-light); cursor: pointer; font-size: 0.9rem; padding: 0; line-height: 1; }
    .active-filter-chip button:hover { color: var(--red); }

    /* DOC GRID */
    .doc-grid { display: flex; flex-direction: column; gap: 10px; }
    .doc-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 20px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .doc-card:hover { border-color: var(--border-hi); background: rgba(13,13,26,0.95); }
    .doc-card.expanded { border-color: var(--border-hi); }
    .doc-top { display: flex; align-items: flex-start; gap: 14px; }
    .doc-icon { font-size: 1.1rem; margin-top: 1px; flex-shrink: 0; }
    .doc-meta { flex: 1; min-width: 0; }
    .doc-title { font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .doc-url { font-size: 0.72rem; color: var(--dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .doc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { font-size: 0.68rem; font-family: var(--mono); padding: 3px 8px; border-radius: 5px; border: 1px solid; }
    .chip-status-ready    { color: var(--green); border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.07); }
    .chip-status-pending  { color: var(--yellow); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.07); }
    .chip-status-processing { color: var(--accent-light); border-color: var(--border-hi); background: var(--purple-lo); }
    .chip-status-failed   { color: var(--red); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.07); }
    .chip-source { color: var(--dim); border-color: var(--xdim); background: var(--bg3); }
    .chip-vis { color: #94a3b8; border-color: var(--xdim); background: var(--bg3); }
    .chip-vis.private { color: #f59e0b; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.07); }
    .chip-tag { color: #c084fc; border-color: rgba(192,132,252,0.3); background: rgba(192,132,252,0.07); }
    .doc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .doc-time { font-size: 0.7rem; color: var(--xdim); font-family: var(--mono); white-space: nowrap; }
    .btn-expand { background: none; border: none; color: var(--xdim); cursor: pointer; font-size: 0.85rem; padding: 2px 6px; font-family: var(--mono); }
    .btn-expand:hover { color: var(--text); }

    /* EXPANDED DETAIL */
    .doc-detail { display: none; border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
    .doc-card.expanded .doc-detail { display: block; }
    .detail-summary { font-size: 0.83rem; color: var(--dim); line-height: 1.6; margin-bottom: 14px; }
    .detail-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .detail-group { flex: 1; min-width: 180px; }
    .detail-group-label { font-size: 0.65rem; font-family: var(--mono); color: var(--xdim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .detail-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .detail-chip { font-size: 0.72rem; font-family: var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--bg3); border: 1px solid var(--border); color: var(--dim); }
    .detail-tags-section { margin-top: 12px; }
    .tag-edit-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .tag-edit-row input { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-family: var(--mono); font-size: 0.78rem; outline: none; width: 120px; }
    .tag-edit-row input:focus { border-color: var(--purple); }
    .tag-edit-row input::placeholder { color: var(--xdim); }
    .btn-tag-add { background: var(--purple); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.78rem; font-family: var(--sans); cursor: pointer; }
    .btn-tag-add:hover { background: var(--purple-dark); }
    .doc-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-action { font-size: 0.78rem; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--dim); font-family: var(--sans); cursor: pointer; }
    .btn-action:hover { background: var(--bg3); color: var(--text); }
    .btn-action.danger:hover { border-color: rgba(239,68,68,0.5); color: var(--red); }
    .btn-action.primary { background: var(--purple-lo); border-color: var(--border-hi); color: var(--accent-light); }
    .btn-action.primary:hover { background: var(--border); }
    .copy-toast { display: inline-block; font-size: 0.72rem; color: var(--green); font-family: var(--mono); margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
    .copy-toast.show { opacity: 1; }

    /* STATES */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 14px; }
    .empty-text { font-size: 0.9rem; }
    .empty-sub { font-size: 0.8rem; color: var(--xdim); margin-top: 6px; }
    .loading-state { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px; color: var(--dim); font-size: 0.85rem; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PAGINATION */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px; }
    .pg-btn { padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--dim); font-family: var(--sans); font-size: 0.82rem; cursor: pointer; }
    .pg-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text); }
    .pg-btn:disabled { opacity: 0.35; cursor: default; }
    .pg-info { font-size: 0.78rem; color: var(--dim); font-family: var(--mono); }
  
  .nav-links { display: flex; align-items: center; gap: 2px; }
  .nav-link { font-size: 0.82rem; color: var(--dim); text-decoration: none; padding: 5px 12px; border-radius: 6px; transition: all 0.15s; }
  .nav-link:hover { color: var(--text); background: var(--purple-lo); }
  .nav-link.active { color: var(--text); background: var(--purple-lo); }

  /* TYPE TABS */
  .type-tabs { display: flex; gap: 4px; margin-bottom: 20px; overflow-x: auto; }
  .type-tab {
    padding: 7px 16px; border-radius: 8px;
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--dim); font-family: var(--sans); font-size: 0.82rem;
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .type-tab:hover { color: var(--text); border-color: var(--border-hi); }
  .type-tab.active { color: #fff; background: var(--purple); border-color: var(--purple); }
  .type-tab .tab-count {
    margin-left: 5px; font-family: var(--mono); font-size: 0.72rem;
    opacity: 0.6;
  }
</style>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href=window._pfx+"/ui/theme.css";document.head.appendChild(l);})()</script>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/ui/app.html" class="nav-logo">
        <div class="nav-logo-mark"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 3a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 10c-2.67 0-5-1.34-6.4-3.37.03-2.12 4.27-3.3 6.4-3.3s6.37 1.18 6.4 3.3C15 13.66 12.67 15 10 15z"/></svg></div>
        <span class="nav-logo-text">dewie</span>
      </a>
      <div class="nav-links">
        <a href="/ui/app.html" class="nav-link">Query</a>
        <a href="/ui/corpus.html" class="nav-link">Corpus</a>
        <a href="/ui/documents.html" class="nav-link active">Catalog</a>
        <a href="/ui/my-uploads.html" class="nav-link">Uploads</a>
      </div>
      <div class="nav-right">
        <span class="nav-user" id="nav-user"></span>
        <a href="/ui/account.html" class="nav-admin" id="nav-account-link" style="display:inline-flex">Account</a>
        <a href="/ui/admin.html" class="nav-admin" id="nav-admin-link">Admin ↗</a>
        <button class="btn-signout" id="btnSignout">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="page">
    <!-- SIDEBAR FILTERS -->
    <aside class="filters">
      <div class="filters-sticky">
        <div class="filter-card">
          <div class="filter-title">Filter</div>

          <label class="filter-label">Status</label>
          <select class="filter-select" id="filterStatus">
            <option value="">All statuses</option>
            <option value="ready">Ready</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="failed">Failed</option>
          </select>

          <label class="filter-label">Tag Filters</label>
          <div class="tag-filter-list" id="tagFilterList"></div>
          <button class="btn-add-tag" id="btnAddTagFilter">+ Add tag filter</button>

          <div style="margin-top:16px">
            <button class="btn-apply" id="btnApply">Apply</button>
            <button class="btn-clear" id="btnClear">Clear all</button>
          </div>
        </div>

        <div class="filter-card">
          <div class="filter-title">Stats</div>
          <div id="statsArea" style="font-size:0.8rem;color:var(--dim);font-family:var(--mono);">—</div>
        </div>

        <div class="filter-card" style="margin-top:auto">
          <a href="/ui/inspect.html" class="tab-btn" style="display:block;width:100%;text-align:center;background:none;border:none;padding:8px 12px;border-radius:7px;font-size:0.84rem;color:var(--dim);cursor:pointer;font-family:var(--sans);transition:all 0.15s;text-decoration:none" onmouseover="this.style.background='var(--purple-lo)';this.style.color='var(--text)'" onmouseout="this.style.background='none';this.style.color='var(--dim)'">🔍 Document Inspector ↗</a>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="page-header">
        <div class="page-title">My Catalog</div>
        <div class="page-count" id="pageCount"></div>
      </div>

      <!-- TYPE TABS -->
      <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" data-type="all">All<span class="tab-count" id="countAll"></span></button>
        <button class="type-tab" data-type="youtube">▶️ YouTube<span class="tab-count" id="countYoutube"></span></button>
        <button class="type-tab" data-type="podcast">🎙️ Podcast<span class="tab-count" id="countPodcast"></span></button>
        <button class="type-tab" data-type="website">🔗 Website<span class="tab-count" id="countWebsite"></span></button>
        <button class="type-tab" data-type="pdf">📄 PDF<span class="tab-count" id="countPdf"></span></button>
        <button class="type-tab" data-type="document">📎 Catalog<span class="tab-count" id="countDocument"></span></button>
      </div>

      <div class="search-row">
        <input class="search-input" id="searchInput" placeholder="Search title, summary, URL…" autocomplete="off" />
      </div>

      <div class="active-filters" id="activeFilters"></div>

      <div id="docList">
        <div class="loading-state"><div class="spinner"></div>Loading…</div>
      </div>

      <div class="pagination" id="pagination" style="display:none">
        <button class="pg-btn" id="pgPrev">← Prev</button>
        <span class="pg-info" id="pgInfo"></span>
        <button class="pg-btn" id="pgNext">Next →</button>
      </div>
    </main>
  </div>

  <script>
    const _nativeFetch = window.fetch.bind(window);
    window.fetch = async (input, init = {}) => {
      const url = typeof input === 'string' ? input : input.url;
      const isSameOrigin = url.startsWith('/') || url.startsWith(window.location.origin);
      if (!isSameOrigin) return _nativeFetch(input, init);

      // Always include credentials for same-origin requests (session cookie)
      const headers = new Headers(init.headers || {});

      // Support legacy API key in localStorage (optional fallback)
      const key = (localStorage.getItem('dewie_api_key') || '').trim();
      if (key && !headers.has('X-API-Key')) {
        headers.set('X-API-Key', key);
      }

      const resp = await _nativeFetch(url, {
        ...init,
        headers,
        credentials: 'include',  // Include session cookie
      });

      // Only redirect to login on 401 (truly unauthenticated). A 403 means
      // authenticated but lacking permission — don't redirect, let the page
      // handle the missing data gracefully. Fixes issue #219.
      if (resp.status === 401 && !key) {
        window.location.href = window._pfx + '/ui/login.html?redirect=' + encodeURIComponent(window.location.pathname);
        return new Response('Redirecting to login...', { status: 302 });
      }

      return resp;
    };

    const PAGE_SIZE = 50;
    let currentOffset = 0;
    let totalDocs = 0;
    let activeSearch = '';
    let activeStatus = '';
    let activeDocType = 'all';
    let activeTagFilters = {}; // {key: val}
    let searchTimer = null;
    let cachedDocs = []; // keep for type tab counts

    // ── Auth ──────────────────────────────────────────────────────────────────
    async function initAuth() {
      const me = await fetch(window._pfx + '/api/auth/me', {credentials:'include'})
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null);

      if (me && me.authenticated !== false && !me.detail) {
        if (me.activation_status === 'pending' || me.activation_status === 'rejected') {
          window.location.href = window._pfx + '/ui/pending.html';
          return;
        }
        document.getElementById('nav-user').textContent = me.email || 'local mode';
        if (me.is_admin) document.getElementById('nav-admin-link').style.display = 'inline-flex';
      } else {
        document.getElementById('nav-user').textContent = 'local mode';
        const signOutBtn = document.querySelector('.btn-signout');
        if (signOutBtn) signOutBtn.style.display = 'none';
      }
    }

    document.getElementById('btnSignout').addEventListener('click', async () => {
      await fetch(window._pfx + '/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = window._pfx + '/ui/login.html';
    });

    // ── Tag filter builder ────────────────────────────────────────────────────
    function addTagFilterRow(key = '', val = '') {
      const list = document.getElementById('tagFilterList');
      const row = document.createElement('div');
      row.className = 'tag-filter-row';
      row.innerHTML = `
        <input placeholder="key" value="${esc(key)}" style="flex:1" />
        <input placeholder="value" value="${esc(val)}" style="flex:1" />
        <button class="btn-rm-tag" title="Remove">×</button>
      `;
      row.querySelector('.btn-rm-tag').addEventListener('click', () => row.remove());
      list.appendChild(row);
    }

    document.getElementById('btnAddTagFilter').addEventListener('click', () => addTagFilterRow());

    function readTagFilters() {
      const rows = document.querySelectorAll('#tagFilterList .tag-filter-row');
      const out = {};
      rows.forEach(r => {
        const [k, v] = r.querySelectorAll('input');
        if (k.value.trim()) out[k.value.trim()] = v.value.trim();
      });
      return out;
    }

    // ── Controls ──────────────────────────────────────────────────────────────
    document.getElementById('btnApply').addEventListener('click', () => {
      activeTagFilters = readTagFilters();
      activeStatus = document.getElementById('filterStatus').value;
      currentOffset = 0;
      loadDocs();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      document.getElementById('filterStatus').value = '';
      document.getElementById('tagFilterList').innerHTML = '';
      document.getElementById('searchInput').value = '';
      activeTagFilters = {};
      activeStatus = '';
      activeSearch = '';
      currentOffset = 0;
      loadDocs();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        activeSearch = e.target.value.trim();
        currentOffset = 0;
        loadDocs();
      }, 350);
    });

    document.getElementById('pgPrev').addEventListener('click', () => {
      if (currentOffset >= PAGE_SIZE) { currentOffset -= PAGE_SIZE; loadDocs(); }
    });
    document.getElementById('pgNext').addEventListener('click', () => {
      if (currentOffset + PAGE_SIZE < totalDocs) { currentOffset += PAGE_SIZE; loadDocs(); }
    });

    // ── Type Tabs ─────────────────────────────────────────────────────────────
    document.querySelectorAll('.type-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeDocType = tab.dataset.type;
        currentOffset = 0;
        loadDocs();
      });
    });

    // ── Fetch & render ────────────────────────────────────────────────────────
    async function loadDocs() {
      const list = document.getElementById('docList');
      list.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';
      renderActiveFilters();

      const params = new URLSearchParams({ limit: PAGE_SIZE, offset: currentOffset });
      if (activeSearch) params.set('search', activeSearch);
      if (activeStatus) params.set('status', activeStatus);
      if (activeDocType && activeDocType !== 'all') params.set('type_filter', activeDocType);
      if (Object.keys(activeTagFilters).length) params.set('tags', JSON.stringify(activeTagFilters));

      let data;
      try {
        const r = await fetch(`/api/documents/my?${params}`, { credentials: 'include' });
        if (r.status === 401) { window.location.href = window._pfx + '/ui/app.html'; return; }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
      } catch (e) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load. ${e.message}</div></div>`;
        return;
      }

      totalDocs = data.total || 0;
      const docs = data.documents || [];

      document.getElementById('pageCount').textContent = `${totalDocs.toLocaleString()} document${totalDocs !== 1 ? 's' : ''}`;

      // Type tab counts
      const typeCounts = { all: totalDocs, youtube: 0, podcast: 0, website: 0, pdf: 0, document: 0 };
      docs.forEach(d => {
        const t = docType(d);
        if (typeCounts[t] !== undefined) typeCounts[t]++;
      });
      document.getElementById('countYoutube').textContent = typeCounts.youtube ? ` ${typeCounts.youtube}` : '';
      document.getElementById('countPodcast').textContent = typeCounts.podcast ? ` ${typeCounts.podcast}` : '';
      document.getElementById('countWebsite').textContent = typeCounts.website ? ` ${typeCounts.website}` : '';
      document.getElementById('countPdf').textContent = typeCounts.pdf ? ` ${typeCounts.pdf}` : '';
      document.getElementById('countDocument').textContent = typeCounts.document ? ` ${typeCounts.document}` : '';

      // Stats
      const statuses = {};
      docs.forEach(d => statuses[d.status] = (statuses[d.status] || 0) + 1);
      const statsHtml = Object.entries(statuses).map(([s, n]) => `${s}: <strong style="color:var(--text)">${n}</strong>`).join(' · ') || '—';
      document.getElementById('statsArea').innerHTML = statsHtml;

      renderPagination();

      if (!docs.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <div class="empty-text">No documents found</div>
            <div class="empty-sub">${activeSearch || activeStatus || Object.keys(activeTagFilters).length ? 'Try adjusting your filters.' : 'Upload some documents to get started.'}</div>
          </div>`;
        return;
      }

      list.innerHTML = '';
      docs.forEach(doc => list.appendChild(buildDocCard(doc)));
    }

    function renderActiveFilters() {
      const el = document.getElementById('activeFilters');
      el.innerHTML = '';
      if (activeDocType && activeDocType !== 'all') {
        const typeLabel = {youtube:'YouTube',podcast:'Podcast',website:'Website',pdf:'PDF',document:'Catalog'}[activeDocType] || activeDocType;
        el.appendChild(makeChip(`type: ${typeLabel}`, () => {
          activeDocType = 'all';
          document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
          document.querySelector('.type-tab[data-type="all"]').classList.add('active');
          currentOffset = 0; loadDocs();
        }));
      }
      if (activeSearch) {
        el.appendChild(makeChip(`search: "${activeSearch}"`, () => {
          activeSearch = '';
          document.getElementById('searchInput').value = '';
          currentOffset = 0; loadDocs();
        }));
      }
      if (activeStatus) {
        el.appendChild(makeChip(`status: ${activeStatus}`, () => {
          activeStatus = '';
          document.getElementById('filterStatus').value = '';
          currentOffset = 0; loadDocs();
        }));
      }
      Object.entries(activeTagFilters).forEach(([k, v]) => {
        el.appendChild(makeChip(`${k}=${v || '*'}`, () => {
          delete activeTagFilters[k];
          // Sync sidebar
          document.querySelectorAll('#tagFilterList .tag-filter-row').forEach(r => {
            const [ki] = r.querySelectorAll('input');
            if (ki.value.trim() === k) r.remove();
          });
          currentOffset = 0; loadDocs();
        }));
      });
    }

    function makeChip(label, onRemove) {
      const d = document.createElement('div');
      d.className = 'active-filter-chip';
      d.innerHTML = `<span>${esc(label)}</span><button title="Remove filter">×</button>`;
      d.querySelector('button').addEventListener('click', onRemove);
      return d;
    }

    function renderPagination() {
      const pg = document.getElementById('pagination');
      if (totalDocs <= PAGE_SIZE) { pg.style.display = 'none'; return; }
      pg.style.display = 'flex';
      const page = Math.floor(currentOffset / PAGE_SIZE) + 1;
      const pages = Math.ceil(totalDocs / PAGE_SIZE);
      document.getElementById('pgInfo').textContent = `Page ${page} / ${pages}`;
      document.getElementById('pgPrev').disabled = currentOffset === 0;
      document.getElementById('pgNext').disabled = currentOffset + PAGE_SIZE >= totalDocs;
    }

    // ── Doc card ──────────────────────────────────────────────────────────────
    function buildDocCard(doc) {
      const card = document.createElement('div');
      card.className = 'doc-card';
      card.dataset.id = doc.id;

      const statusCls = `chip-status-${doc.status}`;
      const tagChips = Object.entries(doc.user_tags || {}).map(([k, v]) =>
        `<span class="chip chip-tag" title="${esc(k)}=${esc(v)}">${esc(k)}${v ? ':'+esc(v) : ''}</span>`
      ).join('');

      const ingested = doc.ingested_at ? relTime(doc.ingested_at) : '';
      const visPrivate = doc.visibility === 'private';

      card.innerHTML = `
        <div class="doc-top">
          <div class="doc-icon">${docIcon(doc)}</div>
          <div class="doc-meta">
            <div class="doc-title" title="${esc(doc.title || doc.url)}">${esc(doc.title || '(untitled)')}</div>
            <div class="doc-url"><a href="${esc(doc.url)}" target="_blank" rel="noopener">${esc(doc.url)}</a></div>
            <div class="doc-chips">
              <span class="chip ${statusCls}">${doc.status}</span>
              ${doc.source ? `<span class="chip chip-source">${esc(doc.source)}</span>` : ''}
              <span class="chip chip-vis${visPrivate ? ' private' : ''}">${visPrivate ? '🔒 private' : '🌐 public'}</span>
              ${doc.scope ? `<span class="chip" style="color:#22d3ee;border-color:rgba(34,211,238,0.3);background:rgba(34,211,238,0.07)" title="${{public:'Accessible to any valid API key',internal_only:'Accessible only within the same workspace',private:'Accessible only to the owner'}[doc.scope] || doc.scope}">scope: ${esc(doc.scope)}</span>` : ''}
              ${tagChips}
            </div>
          </div>
          <div class="doc-right">
            <span class="doc-time">${ingested}</span>
            <button class="btn-expand" title="Expand">▾</button>
          </div>
        </div>
        <div class="doc-detail">
          ${doc.summary ? `<div class="detail-summary">${esc(doc.summary)}</div>` : ''}
          <div class="detail-row">
            ${renderDetailGroup('Topics', doc.topics)}
            ${renderDetailGroup('Keywords', doc.keywords)}
            ${renderDetailGroup('Entities', doc.entities)}
          </div>
          <div class="detail-tags-section">
            <div class="detail-group-label">My Tags</div>
            <div class="detail-chips" id="tagChips-${doc.id}">
              ${renderTagChips(doc.id, doc.user_tags || {})}
            </div>
            <div class="tag-edit-row">
              <input id="tagKey-${doc.id}" placeholder="key" />
              <input id="tagVal-${doc.id}" placeholder="value" />
              <button class="btn-tag-add" data-id="${doc.id}">Add Tag</button>
            </div>
          </div>
          <div class="doc-actions">
            <button class="btn-action primary" onclick="copyId('${doc.id}')">Copy ID <span class="copy-toast" id="toast-${doc.id}">✓</span></button>
            <a class="btn-action" href="${esc(doc.url)}" target="_blank" rel="noopener">Open URL ↗</a>
            <a class="btn-action" href="/ui/inspect.html?id=${doc.id}" target="_blank">Inspect ↗</a>
            ${visPrivate
              ? `<button class="btn-action" data-vis-toggle="${doc.id}" data-current="private">Make public</button>`
              : `<button class="btn-action" data-vis-toggle="${doc.id}" data-current="public">Make private</button>`
            }
            <button class="btn-action danger" data-delete="${doc.id}">Delete</button>
          </div>
        </div>
      `;

      // Expand/collapse
      card.querySelector('.btn-expand').addEventListener('click', e => {
        e.stopPropagation();
        card.classList.toggle('expanded');
        e.target.textContent = card.classList.contains('expanded') ? '▴' : '▾';
      });
      card.querySelector('.doc-top').addEventListener('click', () => {
        card.classList.toggle('expanded');
        card.querySelector('.btn-expand').textContent = card.classList.contains('expanded') ? '▴' : '▾';
      });

      // Add tag
      card.querySelector('.btn-tag-add').addEventListener('click', async () => {
        const key = document.getElementById(`tagKey-${doc.id}`).value.trim();
        const val = document.getElementById(`tagVal-${doc.id}`).value.trim();
        if (!key) return;
        await setTag(doc.id, key, val);
        doc.user_tags = doc.user_tags || {};
        doc.user_tags[key] = val;
        document.getElementById(`tagChips-${doc.id}`).innerHTML = renderTagChips(doc.id, doc.user_tags);
        bindTagRemove(doc);
        document.getElementById(`tagKey-${doc.id}`).value = '';
        document.getElementById(`tagVal-${doc.id}`).value = '';
      });

      // Visibility toggle
      const visBtn = card.querySelector('[data-vis-toggle]');
      if (visBtn) {
        visBtn.addEventListener('click', async () => {
          const newVis = visBtn.dataset.current === 'private' ? 'public' : 'private';
          try {
            const r = await fetch(`/api/documents/${doc.id}/visibility`, {
              method: 'PATCH', credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ visibility: newVis }),
            });
            if (r.ok) {
              doc.visibility = newVis;
              // Refresh card
              const newCard = buildDocCard(doc);
              card.replaceWith(newCard);
            }
          } catch {}
        });
      }

      // Delete
      const delBtn = card.querySelector(`[data-delete="${doc.id}"]`);
      if (delBtn) {
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm(`Delete "${doc.title || doc.url}"? This cannot be undone.`)) return;
          try {
            const r = await fetch(`/api/documents/${doc.id}`, { method: 'DELETE', credentials: 'include' });
            if (r.ok) {
              card.remove();
              totalDocs = Math.max(0, totalDocs - 1);
              document.getElementById('pageCount').textContent = `${totalDocs.toLocaleString()} document${totalDocs !== 1 ? 's' : ''}`;
              renderPagination();
            } else {
              const j = await r.json().catch(() => null);
              alert('Delete failed: ' + (j?.detail || `HTTP ${r.status}`));
            }
          } catch (err) {
            alert('Delete failed: ' + err.message);
          }
        });
      }

      bindTagRemove(doc, card);
      return card;
    }

    function bindTagRemove(doc, card) {
      const container = card
        ? card.querySelector(`#tagChips-${doc.id}`)
        : document.getElementById(`tagChips-${doc.id}`);
      if (!container) return;
      container.querySelectorAll('[data-rm-tag]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const key = btn.dataset.rmTag;
          await deleteTag(doc.id, key);
          delete doc.user_tags[key];
          container.innerHTML = renderTagChips(doc.id, doc.user_tags);
          bindTagRemove(doc);
        });
      });
    }

    function renderTagChips(docId, tags) {
      return Object.entries(tags).map(([k, v]) =>
        `<span class="chip chip-tag" style="cursor:default">${esc(k)}${v ? ':'+esc(v) : ''} <button data-rm-tag="${esc(k)}" title="Remove tag" style="background:none;border:none;color:#c084fc;cursor:pointer;margin-left:4px;font-size:0.9rem;padding:0" >×</button></span>`
      ).join('');
    }

    function renderDetailGroup(label, items) {
      if (!items || !items.length) return '';
      return `<div class="detail-group">
        <div class="detail-group-label">${label}</div>
        <div class="detail-chips">${items.slice(0, 8).map(t => `<span class="detail-chip">${esc(t)}</span>`).join('')}</div>
      </div>`;
    }

    // ── Tag API ───────────────────────────────────────────────────────────────
    async function setTag(docId, key, value) {
      try {
        await fetch(`/api/documents/${docId}/tags`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tags: { [key]: value } }),
        });
      } catch {}
    }

    async function deleteTag(docId, key) {
      try {
        await fetch(`/api/documents/${docId}/tags/${encodeURIComponent(key)}`, {
          method: 'DELETE', credentials: 'include',
        });
      } catch {}
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function copyId(id) {
      navigator.clipboard.writeText(id).catch(() => {});
      const t = document.getElementById(`toast-${id}`);
      if (t) { t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
    }

    function docType(doc) {
      const url = (doc.url || '').toLowerCase();
      const source = (doc.source || '').toLowerCase();

      // YouTube
      if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';

      // Extract path portion only (avoid false matches from query params)
      let path = url;
      try { path = new URL(url).pathname.toLowerCase(); } catch(e) {}

      // Podcast — detected from source or audio file extensions
      if (source === 'podcast' || source === 'podcasts') return 'podcast';
      if (/\.(mp3|mp4|wav|m4a|ogg|podcast)$/.test(path)) return 'podcast';

      // PDF
      if (/.pdf$/.test(path)) return 'pdf';

      // Catalog (Word, Excel, PowerPoint, etc.) — uploaded files
      if (source === 'upload') return 'document';
      if (/\.(docx?|xlsx?|pptx?|odt|ods|odp|pages|numbers|key)$/.test(path)) return 'document';

      // Everything else is a website
      return 'website';
    }

    function docIcon(doc) {
      const url = doc.url || '';
      if (url.includes('youtube.com') || url.includes('youtu.be')) return '▶️';
      if (url.includes('arxiv.org')) return '📄';
      if (url.match(/\.(mp3|mp4|wav|m4a|ogg)($|\?)/i)) return '🎙️';
      if (doc.source === 'upload') return '📎';
      return '🔗';
    }

    function relTime(iso) {
      const d = new Date(iso);
      const secs = Math.floor((Date.now() - d) / 1000);
      if (secs < 60) return 'just now';
      if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
      if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
      if (secs < 86400*30) return `${Math.floor(secs/86400)}d ago`;
      return d.toLocaleDateString();
    }

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    initAuth();
    loadDocs();
  </script>
<script>(function(){var s=document.createElement("script");s.src=window._pfx+"/ui/theme-picker.js";s.defer=true;document.head.appendChild(s);})()</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!window._pfx)return;
  document.querySelectorAll('a[href^="/ui/"]').forEach(function(a){
    a.href=window._pfx+a.getAttribute('href');
  });
});
</script>
