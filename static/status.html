<!DOCTYPE html>
<html lang="en">
<head>
  <script>window._pfx=(function(){var m=location.pathname.match(/^(\/t\/[^/]+)/);return m?m[1]:'';})();</script>
  <script>(function(){var t=localStorage.getItem('dewie-theme')||'signal';document.documentElement.setAttribute('data-theme',t);})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>Service Status — Dewie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #07070f; --bg2: #0d0d1a; --bg3: #12121f;
      --border: var(--border); --purple: var(--purple);
      --purple-lo: var(--purple-lo); --green: #22c55e;
      --red: #ef4444; --yellow: #fbbf24;
      --text: #e2e8f0; --dim: #64748b; --xdim: #334155;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }
    nav { position: sticky; top: 0; z-index: 100; background: rgba(7,7,15,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); margin: -2rem -1rem 2rem; }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .nav-logo-mark { width: 28px; height: 28px; background: var(--purple); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .nav-logo-mark svg { width: 15px; height: 15px; fill: #fff; }
    .nav-logo-text { font-family: var(--mono); font-size: 0.9rem; font-weight: 500; color: var(--text); }
    .nav-logo-text span { color: var(--purple); }
    h1 { text-align: center; font-size: 1.6rem; margin-bottom: 0.25rem; }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 2rem;
    }
    .overall {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: var(--bg2);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.2s;
    }
    .card.ok       { border-color: rgba(34,197,94,0.35); }
    .card.degraded { border-color: rgba(251,191,36,0.35); }
    .card.error    { border-color: rgba(239,68,68,0.35); }
    .card-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a0aec0;
    }
    .card-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok       { background: #48bb78; box-shadow: 0 0 6px #48bb78aa; animation: pulse-ok 2.5s infinite; }
    .dot.degraded { background: #ed8936; box-shadow: 0 0 6px #ed8936aa; animation: pulse-warn 1.8s infinite; }
    .dot.error    { background: #fc8181; box-shadow: 0 0 6px #fc8181aa; animation: pulse-err 1.2s infinite; }
    .dot.loading  { background: #718096; }
    @keyframes pulse-ok   { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
    @keyframes pulse-warn { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes pulse-err  { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    .card-message { font-size: 0.8rem; color: #718096; }

    /* Test section */
    .test-section {
      max-width: 900px;
      margin: 2rem auto 0;
      background: var(--bg2);
      border-radius: 10px;
      padding: 1.4rem;
      border: 1px solid var(--border);
    }
    .test-header { margin-bottom: 1rem; }
    .test-title { font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.2rem; }
    .test-sub { font-size: 0.78rem; color: var(--dim); }
    .test-form-row { display: flex; gap: 8px; }
    .test-input {
      flex: 1;
      padding: 0.55rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--mono);
      outline: none;
    }
    .test-input:focus { border-color: var(--purple); }
    .test-btn {
      padding: 0.55rem 1.2rem;
      background: var(--purple);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .test-btn:hover { opacity: 0.85; }
    .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .test-result-card {
      margin-top: 1rem;
      background: var(--bg);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .test-result-card.ok { border-color: rgba(34,197,94,0.35); }
    .test-result-card.error { border-color: rgba(239,68,68,0.35); }
    .test-result-card.waiting { border-color: rgba(251,191,36,0.35); }
    .test-result-label { color: var(--dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .test-result-value { font-family: var(--mono); font-size: 0.82rem; margin-top: 0.2rem; word-break: break-all; }
    .test-result-row { margin-bottom: 0.6rem; }
    .test-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--dim); border-top: 2px solid var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: #4a5568;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .countdown { color: #4a5568; }
    .countdown span { color: #718096; }
    .refresh-btn, .back-link {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.45rem 1.2rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--dim);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .refresh-btn:hover, .back-link:hover { background: var(--bg3); color: var(--text); }
    .error-banner {
      text-align: center;
      font-size: 0.85rem;
      color: #fc8181;
      margin-top: 1rem;
    }
  </style>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href=window._pfx+"/ui/theme.css";document.head.appendChild(l);})()</script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/ui/app.html" class="nav-logo">
      <div class="nav-logo-mark"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 3a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 10c-2.67 0-5-1.34-6.4-3.37.03-2.12 4.27-3.3 6.4-3.3s6.37 1.18 6.4 3.3C15 13.66 12.67 15 10 15z"/></svg></div>
      <span class="nav-logo-text">dewie</span>
    </a>
  </div>
</nav>
  <h1>🟢 Service Status</h1>
  <p class="subtitle">Dewie — live health indicators</p>

  <div class="overall" id="overall">
    <span class="dot loading" id="overall-dot"></span>
    <span id="overall-text">Checking…</span>
  </div>

  <div class="grid" id="grid">
    <!-- populated by JS -->
  </div>

  <!-- ── Ingestion Test ────────────────────────────────────────────────────── -->
  <div class="test-section">
    <div class="test-header">
      <span class="test-title">🧪 Ingestion Live Test</span>
      <span class="test-sub">Submit a URL, watch it go through the pipeline, and inspect the resulting document</span>
    </div>
    <div class="test-form-row">
      <input class="test-input" id="test-url" value="https://en.wikipedia.org/wiki/Dewey_Decimal_Classification" placeholder="URL to ingest..." />
      <button class="test-btn" id="test-run-btn" onclick="runIngestionTest()">▶ Run Test</button>
    </div>
    <div id="test-results" style="display:none"></div>
  </div>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="footer">
    <div id="checked-at"></div>
    <div class="countdown" id="countdown" style="display:none">
      Next refresh in <span id="countdown-sec">30</span>s
    </div>
    <a class="back-link" href="/ui/admin.html">← Back to Admin</a>
    <button class="refresh-btn" onclick="manualRefresh()">↻ Refresh now</button>
  </div>

  <script>
    const REFRESH_INTERVAL_MS = 30_000;
    let _pollTimer = null;
    let _serviceKey = '';

    const SERVICE_LABELS = {
      api:       "API",
      database:  "Database",
      cache:     "Cache / Redis",
      mcp:       "MCP",
      web_panel: "Web Panel",
      ingestion: "Ingestion Pipeline",
    };

    const OVERALL_LABELS = {
      ok:       "All Systems Operational",
      degraded: "Partial Degradation",
      error:    "Service Disruption",
    };

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function statusLabel(s) {
      return s === "ok" ? "Operational" : s === "degraded" ? "Degraded" : "Error";
    }

    function renderCard(key, svc) {
      const label = SERVICE_LABELS[key] || key;
      return `
        <div class="card ${svc.status}">
          <div class="card-name">${label}</div>
          <div class="card-status">
            <span class="dot ${svc.status}" title="${svc.status}"></span>
            <span>${statusLabel(svc.status)}</span>
          </div>
          <div class="card-message">${svc.message || ""}</div>
        </div>`;
    }

    // ── Countdown ────────────────────────────────────────────────────────────

    let countdownInterval = null;
    let secondsLeft = REFRESH_INTERVAL_MS / 1000;

    function startCountdown() {
      secondsLeft = REFRESH_INTERVAL_MS / 1000;
      document.getElementById("countdown").style.display = "";
      document.getElementById("countdown-sec").textContent = secondsLeft;
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        secondsLeft = Math.max(0, secondsLeft - 1);
        document.getElementById("countdown-sec").textContent = secondsLeft;
      }, 1000);
    }

    // ── Load status ──────────────────────────────────────────────────────────

    async function load() {
      const errorBanner = document.getElementById("error-banner");
      try {
        const res = await fetch("/service-status");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        errorBanner.style.display = "none";

        _serviceKey = data.service_key || '';

        const overall = data.overall || "error";
        document.getElementById("overall-dot").className = `dot ${overall}`;
        document.getElementById("overall-text").textContent =
          OVERALL_LABELS[overall] || overall;

        const grid = document.getElementById("grid");
        grid.innerHTML = Object.entries(data.services)
          .map(([k, v]) => renderCard(k, v))
          .join("");

        const ts = data.checked_at
          ? new Date(data.checked_at).toLocaleString(undefined, {
              dateStyle: "medium",
              timeStyle: "medium",
            })
          : "";
        document.getElementById("checked-at").textContent =
          ts ? `Last checked: ${ts}` : "";

        startCountdown();
      } catch (err) {
        document.getElementById("overall-dot").className = "dot error";
        document.getElementById("overall-text").textContent = "Could not reach API";
        errorBanner.textContent = `Error: ${err.message}`;
        errorBanner.style.display = "";
        document.getElementById("countdown").style.display = "none";
      }
    }

    function manualRefresh() {
      clearInterval(countdownInterval);
      document.getElementById("countdown").style.display = "none";
      load();
    }

    // ── Ingestion Test ───────────────────────────────────────────────────────

    async function runIngestionTest() {
      if (_pollTimer) { clearTimeout(_pollTimer); _pollTimer = null; }

      const url = document.getElementById('test-url').value.trim();
      const btn = document.getElementById('test-run-btn');
      const resultsEl = document.getElementById('test-results');
      if (!url) { alert('Enter a URL'); return; }

      btn.disabled = true;
      btn.textContent = '⏳ Submitting...';
      resultsEl.style.display = 'block';
      resultsEl.innerHTML = `<div class="test-result-card waiting"><span class="test-spinner"></span> Submitting <b>${esc(url)}</b> to the ingestion pipeline...</div>`;

      try {
        const headers = {'Content-Type': 'application/json'};
        if (_serviceKey) {
          headers['X-Service-Key'] = _serviceKey;
        }
        const submit = await fetch(window._pfx + '/api/ingest', {
          method: 'POST',
          headers,
          body: JSON.stringify({url}),
        });

        if (!submit.ok) {
          const err = await submit.json().catch(() => ({detail: `HTTP ${submit.status}`}));
          resultsEl.innerHTML = `<div class="test-result-card error">❌ <b>Ingest rejected</b>: ${esc(err.detail || err.message || 'unknown error')}</div>`;
          btn.disabled = false;
          btn.textContent = '▶ Run Test';
          return;
        }

        const data = await submit.json();
        const docIds = data.accepted || [];
        if (!docIds.length) {
          resultsEl.innerHTML = `<div class="test-result-card error">❌ <b>Ingest accepted</b> but no document IDs returned. Message: ${esc(data.message || 'none')}</div>`;
          btn.disabled = false;
          btn.textContent = '▶ Run Test';
          return;
        }

        const docId = docIds[0];
        resultsEl.innerHTML = `<div class="test-result-card waiting"><span class="test-spinner"></span> ✅ Submitted. Document <b>${esc(docId)}</b> queued. Polling for enrichment...</div>`;

        // Poll for status
        pollDocument(docId, 0, btn);

      } catch (err) {
        resultsEl.innerHTML = `<div class="test-result-card error">❌ <b>Network error</b>: ${esc(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = '▶ Run Test';
      }
    }

    async function pollDocument(docId, attempt, btn) {
      const maxAttempts = 60; // ~2 min at 2s intervals
      const resultsEl = document.getElementById('test-results');

      if (attempt >= maxAttempts) {
        resultsEl.innerHTML = `<div class="test-result-card error">⏱️ <b>Timed out</b> after ~2 minutes. Document ${esc(docId)} may still be processing. Check the pipeline dashboard.</div>`;
        btn.disabled = false;
        btn.textContent = '▶ Run Test';
        return;
      }

      try {
        const res = await fetch(window._pfx + `/api/documents/${docId}/inspect`);
        if (!res.ok) {
          // Doc not ready yet
          const dots = '.'.repeat((attempt % 5) + 1);
          resultsEl.innerHTML = `<div class="test-result-card waiting"><span class="test-spinner"></span> Waiting for document to be processed${dots} (${attempt + 1}s)</div>`;
          _pollTimer = setTimeout(() => pollDocument(docId, attempt + 1, btn), 2000);
          return;
        }

        const doc = await res.json();
        renderTestResult(doc, btn);
      } catch (err) {
        resultsEl.innerHTML = `<div class="test-result-card error">❌ <b>Poll error</b>: ${esc(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = '▶ Run Test';
      }
    }

    function renderTestResult(doc, btn) {
      const resultsEl = document.getElementById('test-results');
      const status = doc.status || 'unknown';
      const title = doc.title || '—';
      const source = doc.source || '—';
      const hasEmbedding = doc.has_embedding ? '✅ Yes' : '❌ No';
      const enrichedAt = doc.enriched_at ? new Date(doc.enriched_at).toLocaleString() : '—';
      const bodyLen = (doc.body_text || '').length;
      const summary = doc.embed_summary ? (doc.embed_summary.slice(0, 200) + (doc.embed_summary.length > 200 ? '...' : '')) : '—';
      const aqCount = doc.aq_count || (doc.answers_questions || []).length;

      const statusEmoji = status === 'ready' ? '✅' : status === 'pending' || status === 'processing' ? '🔄' : '❌';
      const cardClass = status === 'ready' ? 'ok' : status === 'pending' || status === 'processing' ? 'waiting' : 'error';

      resultsEl.innerHTML = `
        <div class="test-result-card ${cardClass}">
          <div class="test-result-row">
            <div class="test-result-label">Status</div>
            <div style="font-size:1rem;font-weight:600;margin-top:0.2rem">${statusEmoji} ${status}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Title</div>
            <div class="test-result-value">${esc(title)}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Source</div>
            <div class="test-result-value">${esc(source)}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Document ID</div>
            <div class="test-result-value" style="font-size:0.7rem">${esc(doc.id || '')}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Body length</div>
            <div class="test-result-value">${bodyLen.toLocaleString()} characters</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Has embedding</div>
            <div class="test-result-value">${hasEmbedding}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Enriched at</div>
            <div class="test-result-value">${esc(enrichedAt)}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Questions generated</div>
            <div class="test-result-value">${aqCount}</div>
          </div>
          <div class="test-result-row">
            <div class="test-result-label">Summary</div>
            <div class="test-result-value" style="font-size:0.78rem;line-height:1.5">${esc(summary)}</div>
          </div>
          <div style="margin-top:0.8rem;display:flex;gap:8px">
            <button class="test-btn" onclick="runIngestionTest()" style="font-size:0.78rem;padding:0.4rem 0.9rem">▶ Run Again</button>
            <a class="back-link" href="/ui/inspect.html?id=${esc(doc.id || '')}" target="_blank" style="font-size:0.78rem;padding:0.4rem 0.9rem">🔍 Full Inspection</a>
          </div>
        </div>`;

      btn.disabled = false;
      btn.textContent = '▶ Run Test';
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
<script>(function(){var s=document.createElement("script");s.src=window._pfx+"/ui/theme-picker.js";s.defer=true;document.head.appendChild(s);})()</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!window._pfx)return;
  document.querySelectorAll('a[href^="/ui/"]').forEach(function(a){
    a.href=window._pfx+a.getAttribute('href');
  });
});
</script>
</body>
</html>
