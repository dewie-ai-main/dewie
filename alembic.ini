# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = src/dewie/migrations

# template used to generate migration file names; Default: 'alembic_%(rev)s_%(slug)s'
file_template = 00000%%(rev)s_%%(slug)s

# time zone to use when generating/reconciling revision timestamps,
# using ISO format with either tz-aware or tz-naive values.
timezone = UTC

# set to 'use_naming_convention' to enable leading underscores for
# naming consistency
# rename_matching = ^

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
